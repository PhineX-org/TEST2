<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="../Assets/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الجاسوس">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإحصائيات | El Jasus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="icon" type="image/png" href="../Assets/ElJasus.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/mobile.css">
    <script src="../Assets/inbox.js"></script>
    <style>
        :root{--primary:#00f2ff;--secondary:#a3e635;}
        body{font-family:'Cairo',sans-serif;background:#000000;background-image:radial-gradient(ellipse 120% 70% at 50% -10%,rgba(0,242,255,.12),transparent 60%),radial-gradient(ellipse 90% 55% at 100% 105%,rgba(163,230,53,.07),transparent 60%);
            background-attachment:fixed;color:#fff;min-height:100vh;overflow-x:hidden;}
        body::before{content:'';position:fixed;inset:0;
            background-image:linear-gradient(rgba(0,242,255,.03) 1px,transparent 1px),
            linear-gradient(90deg,rgba(0,242,255,.03) 1px,transparent 1px);
            background-size:50px 50px;animation:gridMove 20s linear infinite;pointer-events:none;z-index:0;}
        @keyframes gridMove{to{transform:translateY(50px);}}
        .glass{background:linear-gradient(135deg,rgba(0,0,0,.92),rgba(0,0,0,.85));
            backdrop-filter:blur(20px);border:2px solid;position:relative;overflow:hidden;
            border-image:linear-gradient(135deg,rgba(0,242,255,.3),rgba(163,230,53,.3)) 1;
            box-shadow:0 8px 32px rgba(0,0,0,.4);}
        .neon{font-family:'Orbitron',sans-serif;text-shadow:0 0 10px rgba(0,242,255,.8);}
        .stat-num{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;}
        canvas{max-height:240px;}
        .perf-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;}
        .perf-fill{height:100%;border-radius:4px;transition:width 1s ease;}
        .report-tag{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer;transition:all .2s;}
        .report-tag:hover{transform:scale(1.05);}
        /* ── classic-edition palette: remap Tailwind colour utilities (black / cyan / lime) ── */
        .text-cyan-400{color:rgb(0 242 255 / 1) !important;}
        .text-green-400{color:rgb(163 230 53 / 1) !important;}
        .text-orange-400{color:rgb(0 242 255 / 1) !important;}
        .text-red-400{color:rgb(0 242 255 / 1) !important;}
        .bg-green-500\/20{background-color:rgb(163 230 53 / 0.2) !important;}
        .bg-red-500\/20{background-color:rgb(0 242 255 / 0.2) !important;}
        .border-green-500\/30{border-color:rgb(163 230 53 / 0.3) !important;}
        .border-red-500\/30{border-color:rgb(0 242 255 / 0.3) !important;}
        .hover\:text-cyan-400:hover{color:rgb(0 242 255 / 1) !important;}
    </style>
</head>
<body class="p-4 has-mobile-nav">
<div class="max-w-6xl mx-auto relative z-10">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <a href="home.html" class="flex items-center gap-2 text-gray-400 hover:text-cyan-400 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            <span class="text-sm font-bold">رجوع</span>
        </a>
        <div class="text-center">
            <h1 class="text-3xl font-black neon uppercase">الإحصائيات</h1>
            <p style="font-family:'Orbitron',sans-serif;font-size:10px;color:rgba(255,255,255,.4);letter-spacing:3px;">ANALYTICS</p>
        </div>
        <div class="w-24"></div>
    </div>

    <!-- KPI Row -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="glass rounded-2xl p-5">
            <p class="text-xs text-gray-400 uppercase font-bold mb-2">إجمالي المباريات</p>
            <p id="kpi-total" class="stat-num text-cyan-400">0</p>
        </div>
        <div class="glass rounded-2xl p-5">
            <p class="text-xs text-gray-400 uppercase font-bold mb-2">نسبة الفوز</p>
            <p id="kpi-wr" class="stat-num text-green-400">0%</p>
        </div>
        <div class="glass rounded-2xl p-5">
            <p class="text-xs text-gray-400 uppercase font-bold mb-2">انتصارات جاسوس</p>
            <p id="kpi-spy" class="stat-num text-red-400">0</p>
        </div>
        <div class="glass rounded-2xl p-5">
            <p class="text-xs text-gray-400 uppercase font-bold mb-2">أطول سلسلة</p>
            <p id="kpi-streak" class="stat-num text-orange-400">0</p>
        </div>
    </div>

    <!-- Charts row -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">

        <!-- Win distribution doughnut -->
        <div class="glass rounded-2xl p-6">
            <h3 class="neon text-lg font-black mb-4">توزيع الانتصارات</h3>
            <canvas id="donutChart"></canvas>
            <div class="flex justify-center gap-6 mt-4 text-sm">
                <span class="flex items-center gap-2"><span style="width:12px;height:12px;border-radius:50%;background:#00f2ff;display:inline-block;"></span> جاسوس</span>
                <span class="flex items-center gap-2"><span style="width:12px;height:12px;border-radius:50%;background:#a3e635;display:inline-block;"></span> بريء</span>
                <span class="flex items-center gap-2"><span style="width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);display:inline-block;"></span> خسارة</span>
            </div>
        </div>

        <!-- Performance per category bar chart -->
        <div class="glass rounded-2xl p-6">
            <h3 class="neon text-lg font-black mb-4">الأداء بحسب الفئة</h3>
            <canvas id="catChart"></canvas>
        </div>
    </div>

    <!-- Performance Metrics -->
    <div class="glass rounded-2xl p-6 mb-6">
        <h3 class="neon text-lg font-black mb-5">مؤشرات الأداء</h3>
        <div class="space-y-5" id="perf-metrics"></div>
    </div>

    <!-- Game History -->
    <div class="glass rounded-2xl p-6 mb-6">
        <h3 class="neon text-lg font-black mb-4">آخر 10 مباريات</h3>
        <div id="history-list" class="space-y-3"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnd-pmKEatI3DaFz6xHWB5ucurtHXt9tk",
  authDomain: "el-jasus.firebaseapp.com",
  databaseURL: "https://el-jasus-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "el-jasus",
  storageBucket: "el-jasus.firebasestorage.app",
  messagingSenderId: "415659587906",
  appId: "1:415659587906:web:782f7940176ea4097eb0db",
  measurementId: "G-N4K79FP56N"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);
window._firebaseFns = { ref, get, push };

let currentUser = null;
let userData = {};

// ── LOAD ANALYTICS ────────────────────────
onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href='login.html'; return; }
    currentUser = user;
    const snap = await get(ref(db, `players/${user.uid}`));
    if (!snap.exists()) return;
    
    // Load moderation if available
    if (typeof MOD !== 'undefined' && MOD.init) {
        await MOD.init(db, user);
        if (document.getElementById('_ej_ban')) return;
    }
    
    userData = snap.val();
    const stats = userData.stats || {};
    renderKPIs(stats);
    renderCharts(stats, userData.categoryStats || {});
    renderPerfMetrics(stats);
    renderHistory(userData.gameHistory || []);
});

function renderKPIs(s) {
    const total = s.totalGames || 0;
    const wins  = (s.spyWins||0) + (s.innocentWins||0);
    document.getElementById('kpi-total').textContent  = total;
    document.getElementById('kpi-wr').textContent     = total ? Math.round(wins/total*100)+'%' : '0%';
    document.getElementById('kpi-spy').textContent    = s.spyWins || 0;
    document.getElementById('kpi-streak').textContent = s.longestWinStreak || 0;
}

function renderCharts(s, cats) {
    // Donut
    const total  = s.totalGames || 1;
    const spy    = s.spyWins || 0;
    const inno   = s.innocentWins || 0;
    const loss   = total - spy - inno;

    new Chart(document.getElementById('donutChart'), {
        type: 'doughnut',
        data: { labels:['جاسوس','بريء','خسارة'], datasets:[{
            data:[spy,inno,Math.max(loss,0)],
            backgroundColor:['#00f2ff','#a3e635','rgba(255,255,255,.25)'],
            borderColor:'transparent', hoverOffset:8
        }]},
        options:{ plugins:{ legend:{ display:false } }, cutout:'70%',
            responsive:true, animation:{ animateRotate:true, duration:1200 }}
    });

    // Category bar
    const labels = Object.keys(cats).slice(0,6);
    const values = labels.map(k=>cats[k]);
    new Chart(document.getElementById('catChart'), {
        type:'bar',
        data:{ labels, datasets:[{
            label:'المباريات',
            data:values,
            backgroundColor:'rgba(0,242,255,.3)',
            borderColor:'#00f2ff',
            borderWidth:2, borderRadius:8
        }]},
        options:{
            plugins:{ legend:{display:false} },
            scales:{
                x:{ ticks:{ color:'rgba(255,255,255,.6)', font:{family:'Cairo'} }, grid:{ color:'rgba(255,255,255,.05)' } },
                y:{ ticks:{ color:'rgba(255,255,255,.6)' }, grid:{ color:'rgba(255,255,255,.05)' } }
            },
            responsive:true
        }
    });
}

function renderPerfMetrics(s) {
    const metrics = [
        { label:'معدل كشف الجاسوس', val: s.spyDetectionRate||0, max:100, color:'#ffffff', suffix:'%' },
        { label:'معدل الفوز كجاسوس', val: s.totalGames ? Math.round((s.spyWins||0)/Math.max(s.spyGames||1,1)*100):0, max:100, color:'#00f2ff', suffix:'%' },
        { label:'معدل الفوز كبريء',  val: s.totalGames ? Math.round((s.innocentWins||0)/Math.max((s.totalGames||1)-(s.spyGames||0),1)*100):0, max:100, color:'#a3e635', suffix:'%' },
    ];
    document.getElementById('perf-metrics').innerHTML = metrics.map(m => `
        <div>
            <div class="flex justify-between mb-2">
                <span class="text-sm font-bold">${m.label}</span>
                <span style="font-family:'Orbitron',sans-serif;color:${m.color};font-size:13px;font-weight:900;">${m.val}${m.suffix}</span>
            </div>
            <div class="perf-bar">
                <div class="perf-fill" style="width:${Math.min(m.val,100)}%;background:${m.color};"></div>
            </div>
        </div>`).join('');
}

function renderHistory(history) {
    const list = document.getElementById('history-list');
    if (!history.length) { list.innerHTML='<p class="text-gray-400 text-center py-4">لا توجد مباريات مسجلة بعد</p>'; return; }
    list.innerHTML = [...history].reverse().slice(0,10).map(g => `
        <div class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/5">
            <div class="flex items-center gap-3">
                <span style="font-size:20px;">${g.role==='spy'?'🕵️':'🛡️'}</span>
                <div>
                    <p class="font-bold text-sm">${g.category || 'عام'}</p>
                    <p class="text-xs text-gray-400">${new Date(g.timestamp).toLocaleDateString('ar-SA')}</p>
                </div>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-bold
                ${g.won?'bg-green-500/20 text-green-400 border border-green-500/30':'bg-red-500/20 text-red-400 border border-red-500/30'}">
                ${g.won?'فوز':'خسارة'}
            </span>
        </div>`).join('');
}
</script>
    <link rel="stylesheet" href="../Assets/mobile.css">
    <script src="../Assets/dialogs.js"></script>
<script>
    window.alert   = (msg)             => UIAlert ? UIAlert(msg) : alert(msg);
    window.confirm = (msg)             => UIConfirm ? UIConfirm(msg) : confirm(msg);
    window.prompt  = (msg, defaultVal) => UIPrompt ? UIPrompt(msg, { defaultValue: defaultVal }) : prompt(msg, defaultVal);
</script>
    <script src="../Assets/sound-system.js" defer></script>
    <script src="../Assets/qr-notifications.js" defer></script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
    <script src="../Assets/moderation.js"></script>
</body>
</html>
