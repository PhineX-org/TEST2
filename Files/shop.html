<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر | El Jasus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../Assets/ElJasus.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="../Assets/name-themes.js"></script>
    <script src="../Assets/dialogs.js"></script>
    <script src="../Assets/friend-invite-enhanced.js" defer></script>
    <script src="../Assets/profile-viewer.js" defer></script>
    <script src="../Assets/inbox.js"></script>
    
    <style>
        :root {
            --bg-dark: #000000;
            --primary: #00f2ff;
            --secondary: #a3e635;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: #000000;
            background-image:
                radial-gradient(ellipse 120% 70% at 50% -10%, rgba(0,242,255,0.12), transparent 60%),
                radial-gradient(ellipse 90% 55% at 100% 105%, rgba(163,230,53,0.07), transparent 60%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0,242,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,242,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }
        
        .glass {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0,242,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        .shop-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .shop-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,242,255,0.3);
            border-color: rgba(0,242,255,0.5);
        }
        
        .preview-name {
            font-size: 20px;
            font-weight: 900;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            margin: 10px 0;
        }
        
        .tab-btn {
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0,242,255,0.5);
            color: #000000;
        }

        .filter-chip {
            transition: all 0.2s;
            border: 1px solid rgba(0,242,255,0.25);
            background: rgba(0,0,0,0.4);
            color: rgba(255,255,255,0.7);
        }

        .filter-chip.active {
            background: rgba(163,230,53,0.18);
            border-color: rgba(163,230,53,0.7);
            color: #a3e635;
        }

        .new-ribbon {
            position: absolute;
            top: -1px;
            inset-inline-end: -1px;
            background: linear-gradient(135deg, #a3e635, #84cc16);
            color: #000000;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 0 14px 0 12px;
            letter-spacing: .05em;
            box-shadow: 0 2px 10px rgba(163,230,53,0.5);
        }

        .locked-item {
            opacity: 0.9;
            border-color: rgba(0,242,255,0.15) !important;
        }
    </style>
</head>
<body class="p-4">
    
    <div class="max-w-6xl mx-auto relative z-10">
        
        <!-- Header -->
        <div class="glass rounded-2xl flex items-center justify-between mb-6 px-5 py-4">
            <a href="home.html" class="flex items-center gap-2 text-gray-400 hover:text-cyan-400 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span class="text-sm font-bold">رجوع</span>
            </a>
            
            <h1 class="text-3xl font-black" style="font-family: 'Orbitron', sans-serif; color: var(--primary); text-shadow: 0 0 20px rgba(0,242,255,0.8);">
                🛒 المتجر
            </h1>
            
            <div class="flex items-center gap-2 rounded-xl px-4 py-2" style="background: rgba(163,230,53,0.12); border: 1px solid rgba(163,230,53,0.4);">
                <span class="text-sm font-bold">🪙</span>
                <span id="coinBalance" class="font-black" style="font-family: 'Orbitron', sans-serif; color: #a3e635;">0</span>
            </div>
        </div>
        <!-- Error message container -->
        <div id="shopError" class="hidden glass rounded-2xl p-4 mb-4 text-center" style="border-color: rgba(163,230,53,0.5); color: #a3e635;"></div>
        <!-- Tabs -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button class="tab-btn active px-6 py-3 rounded-xl font-black text-sm" data-tab="themes">
                ✨ ثيمات الأسماء
            </button>
            <button class="tab-btn px-6 py-3 rounded-xl font-black text-sm" data-tab="tags">
                🏷️ الالقاب
            </button>
            <button class="tab-btn px-6 py-3 rounded-xl font-black text-sm" data-tab="ranks">
                🎖️ الرتب
            </button>
        </div>
        
        <!-- Themes Tab -->
        <div id="tab-themes" class="tab-content">
            <div class="flex gap-2 mb-5 overflow-x-auto pb-1" id="themeFilterChips">
                <button class="filter-chip active px-4 py-1.5 rounded-full text-xs font-bold" data-filter="all">الكل</button>
                <button class="filter-chip px-4 py-1.5 rounded-full text-xs font-bold" data-filter="static">ثابت</button>
                <button class="filter-chip px-4 py-1.5 rounded-full text-xs font-bold" data-filter="animated">متحرك</button>
                <button class="filter-chip px-4 py-1.5 rounded-full text-xs font-bold" data-filter="particle">جزيئات</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="themesGrid"></div>
        </div>
        
        <!-- Tags Tab -->
        <div id="tab-tags" class="tab-content hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="tagsGrid"></div>
        </div>

        <!-- Ranks Tab -->
        <div id="tab-ranks" class="tab-content hidden">
            <p class="text-sm text-gray-400 mb-4">الرتب تُكتسب تلقائياً من نقاط الرتبة أثناء اللعب، وهي غير قابلة للشراء.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="ranksGrid"></div>
        </div>
        
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDnd-pmKEatI3DaFz6xHWB5ucurtHXt9tk",
            authDomain: "el-jasus.firebaseapp.com",
            databaseURL: "https://el-jasus-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "el-jasus",
            storageBucket: "el-jasus.firebasestorage.app",
            messagingSenderId: "415659587906",
            appId: "1:415659587906:web:782f7940176ea4097eb0db"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let currentUser = null;
        let userActiveTheme = 'default';
        let userActiveTag = null;
        let userCoins = 0;
        let userRankPoints = 0;
        let userInventory = { nameThemes: [], nameTags: [] };
        
        onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        try {
            await loadUserData();
            renderShop();
        } catch (error) {
            console.error('فشل تحميل بيانات المستخدم:', error);
            showError('⚠️ فشل تحميل بيانات المتجر. يرجى تحديث الصفحة.');
            // مع ذلك نعرض واجهة فارغة أو نعيد التوجيه
            document.getElementById('themesGrid').innerHTML = '<div class="col-span-full text-center text-red-400 p-4">تعذر تحميل البيانات</div>';
        }
    } else {
        window.location.href = 'login.html';
    }
});

function showError(message) {
    const errorEl = document.getElementById('shopError');
    if (errorEl) {
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
    } else {
        alert(message);
    }
}

function hideError() {
    const errorEl = document.getElementById('shopError');
    if (errorEl) errorEl.classList.add('hidden');
}
        
        async function loadUserData() {
    try {
        const snapshot = await get(ref(db, `players/${currentUser.uid}`));
        const data = snapshot.exists() ? snapshot.val() : {};
        if (snapshot.exists()) {
            userCoins = data.coins || 0;
            userRankPoints = parseInt(data.rankPoints) || 0;
            
            const inv = data.inventory || {};
            userInventory = {
                nameThemes: Array.isArray(inv.nameThemes) ? inv.nameThemes : ['default'],
                nameTags: Array.isArray(inv.nameTags) ? inv.nameTags : []
            };
        } else {
            userCoins = 0;
            userRankPoints = 0;
            userInventory = { nameThemes: ['default'], nameTags: [] };
        }
        document.getElementById('coinBalance').textContent = userCoins;
        userActiveTheme = data.nameTheme || 'default';
        userActiveTag = data.nameTag || null;
        hideError();
    } catch (error) {
        console.error('خطأ في تحميل بيانات المستخدم:', error);
        showError('⚠️ فشل تحميل بيانات المتجر. يرجى تحديث الصفحة.');
    }
}
        
        function renderShop() {
    // التحقق من وجود نظام الثيمات
    if (!window.NameThemes) {
        showError('❌ نظام الثيمات غير محمل. تأكد من وجود name-themes.js.');
        return;
    }
    
    renderThemes();
    renderTags();
    renderRanks(userRankPoints);

}
        
        const NEW_THEME_KEYS = ['voidBlack','royalGold','holographicShift','matrixRain','laserScan','infernoPulse','emberStorm','crownRain','galaxyDust','butterflyGarden'];
        let activeThemeFilter = 'all';

        function renderThemes() {
    const grid = document.getElementById('themesGrid');
    if (!grid) return;
    
    try {
        const themes = window.NameThemes.themes;
        if (!themes || Object.keys(themes).length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center text-gray-400 p-4">لا توجد ثيمات متاحة</div>';
            return;
        }
        
        // التأكد من أن userInventory.nameThemes مصفوفة
        const ownedThemes = Array.isArray(userInventory.nameThemes) ? userInventory.nameThemes : ['default'];
        
        const keys = Object.keys(themes)
            .filter(key => activeThemeFilter === 'all' || themes[key].type === activeThemeFilter)
            .sort((a, b) => (themes[a].price || 0) - (themes[b].price || 0));

        if (keys.length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center text-gray-400 p-4">لا توجد ثيمات في هذا التصنيف</div>';
            return;
        }

        grid.innerHTML = keys.map(key => {
            const theme = themes[key];
            const owned = ownedThemes.includes(key);
            const isActive = userActiveTheme === key;
            const isNew = NEW_THEME_KEYS.includes(key);
            const typeLabel = theme.type === 'animated' ? 'متحرك' : theme.type === 'particle' ? 'جزيئات' : 'ثابت';
            const typePillStyle = theme.type === 'animated'
                ? 'background: rgba(163,230,53,0.16); color: #a3e635; border: 1px solid rgba(163,230,53,0.4);'
                : theme.type === 'particle'
                    ? 'background: linear-gradient(135deg, rgba(0,242,255,0.2), rgba(163,230,53,0.2)); color: #ffffff; border: 1px solid rgba(0,242,255,0.4);'
                    : 'background: rgba(0,242,255,0.16); color: #00f2ff; border: 1px solid rgba(0,242,255,0.4);';
            
            return `
                <div class="glass rounded-2xl p-5 shop-item relative" style="${owned ? 'border-color: rgba(163,230,53,0.6);' : ''}">
                    ${isNew ? '<span class="new-ribbon">جديد</span>' : ''}
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-black text-lg">${theme.name}</h3>
                        <span class="px-3 py-1 rounded-full text-xs font-black" style="${typePillStyle}">
                            ${typeLabel}
                        </span>
                    </div>
                    
                    <div class="mb-4 text-center">
                        <div class="preview-name" id="preview-${key}">اسم اللاعب</div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">🪙</span>
                            <span class="font-black text-xl" style="font-family: 'Orbitron', sans-serif; color: var(--primary);">
                                ${theme.price}
                            </span>
                        </div>
                        ${owned ? `
                            <div class="flex flex-col gap-1 items-end">
                                ${isActive
                                    ? '<span class="text-xs font-black" style="color:#00f2ff;">⚡ مفعّل</span>'
                                    : '<span class="text-xs font-bold" style="color:#a3e635;">✓ مملوك</span>'
                                }
                                <button onclick="window.activateTheme('${key}')"
                                    class="px-4 py-1.5 rounded-lg text-xs font-black transition-all ${isActive ? 'cursor-default' : 'hover:scale-105'}"
                                    style="${isActive ? 'background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.15);' : 'background: rgba(0,242,255,0.16); color: #00f2ff; border: 1px solid rgba(0,242,255,0.45);'}">
                                    ${isActive ? 'مفعّل' : 'تفعيل'}
                                </button>
                            </div>
                        ` : `
                            <button onclick="window.buyTheme('${key}')"
                                class="px-6 py-2 rounded-xl font-black text-sm hover:scale-105 transition-all"
                                style="background: linear-gradient(135deg, #00f2ff, #a3e635); color: #000000;">
                                شراء
                            </button>
                        `}
                    </div>
                </div>
            `;
        }).join('');
        
        // تطبيق معاينة الثيمات
        setTimeout(() => {
            keys.forEach(key => {
                const el = document.getElementById(`preview-${key}`);
                if (el) {
                    try {
                        window.NameThemes.applyTheme(el, key, 'اسم اللاعب');
                    } catch (e) {
                        console.warn(`فشل تطبيق معاينة الثيم ${key}:`, e);
                    }
                }
            });
        }, 100);
        
    } catch (error) {
        console.error('خطأ في renderThemes:', error);
        grid.innerHTML = '<div class="col-span-full text-center p-4" style="color:#a3e635;">حدث خطأ أثناء تحميل الثيمات</div>';
    }
}

        document.querySelectorAll('#themeFilterChips .filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                activeThemeFilter = chip.dataset.filter;
                document.querySelectorAll('#themeFilterChips .filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                renderThemes();
            });
        });
        
        function renderTags() {
    const grid = document.getElementById('tagsGrid');
    if (!grid) return;
    
    try {
        const tags = window.NameThemes.tags;
        if (!tags || Object.keys(tags).length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center text-gray-400 p-4">لا توجد وسوم متاحة</div>';
            return;
        }
        
        const ownedTags = Array.isArray(userInventory.nameTags) ? userInventory.nameTags : [];
        
        grid.innerHTML = Object.keys(tags).map(key => {
            const tag = tags[key];
            const owned = ownedTags.includes(key);
            const isActive = userActiveTag === key;
            const purchasable = tag.purchasable !== false; // explicit false = admin/database-only grant
            
            let actionHtml;
            if (owned) {
                actionHtml = `
                    <div class="flex flex-col gap-1 items-end">
                        <span class="text-xs font-bold" style="color:#a3e635;">✓ مملوك</span>
                        <button onclick="window.activateTag('${key}')"
                            class="px-4 py-1.5 rounded-lg text-xs font-black transition-all hover:scale-105"
                            style="background: rgba(0,242,255,0.16); color: #00f2ff; border: 1px solid rgba(0,242,255,0.45);">
                            تفعيل
                        </button>
                    </div>`;
            } else if (!purchasable) {
                actionHtml = `
                    <span class="px-4 py-2 rounded-xl text-xs font-black" style="background: rgba(0,242,255,0.08); color: rgba(0,242,255,0.6); border: 1px dashed rgba(0,242,255,0.35);">
                        🔒 يُمنح إدارياً فقط
                    </span>`;
            } else {
                actionHtml = `
                    <button onclick="window.buyTag('${key}')"
                        class="px-6 py-2 rounded-xl font-black text-sm hover:scale-105 transition-all"
                        style="background: linear-gradient(135deg, #00f2ff, #a3e635); color: #000000;">
                        شراء
                    </button>`;
            }

            return `
                <div class="glass rounded-2xl p-5 shop-item ${!purchasable && !owned ? 'locked-item' : ''}" style="${owned ? 'border-color: rgba(163,230,53,0.6);' : ''}">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="text-4xl">${tag.icon}</span>
                        <div>
                            <h3 class="font-black text-lg">${tag.name}</h3>
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-black mt-1" 
                                 style="background: ${tag.bgColor}; border: ${tag.border}; color: ${tag.color};">
                                ${tag.icon} ${tag.name}
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            ${purchasable ? `
                                <span class="text-2xl">🪙</span>
                                <span class="font-black text-xl" style="font-family: 'Orbitron', sans-serif; color: var(--primary);">
                                    ${tag.price}
                                </span>
                            ` : `
                                <span class="text-xs font-bold" style="color: rgba(255,255,255,0.4);">غير معروض للبيع</span>
                            `}
                        </div>
                        ${actionHtml}
                    </div>
                </div>
            `;
        }).join('');
        
    } catch (error) {
        console.error('خطأ في renderTags:', error);
        grid.innerHTML = '<div class="col-span-full text-center p-4" style="color:#a3e635;">حدث خطأ أثناء تحميل الوسوم</div>';
    }
}
        
        function renderRanks(userPoints = 0) {
    const grid = document.getElementById('ranksGrid');
    if (!grid) return;
    
    try {
        if (!window.NameThemes || !window.NameThemes.ranks) {
            grid.innerHTML = '<div class="col-span-full text-center text-gray-400 p-4">نظام الرتب غير متاح حالياً</div>';
            return;
        }
        
        const ranks = window.NameThemes.ranks;
        const userRank = window.NameThemes.getRank(userPoints);

        grid.innerHTML = Object.keys(ranks).map(key => {
            const rank = ranks[key];
            const isCurrent = rank.key === userRank.key;

            return `<div class="rounded-2xl p-4 border-2 transition-all" id="rankCard-${key}"
                         style="border-color: ${isCurrent ? rank.color : rank.color + '30'}; background: ${isCurrent ? rank.color + '14' : 'rgba(0,0,0,0.2)'};">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-12 h-12 flex-shrink-0" id="rankShowcaseIcon-${key}"></div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <h3 class="font-black text-xl" style="color: ${rank.color};">${rank.nameAr}</h3>
                                ${isCurrent ? '<span class="text-[9px] font-black px-2 py-0.5 rounded-full" style="background:' + rank.color + '33; color:' + rank.color + ';">رتبتك</span>' : ''}
                            </div>
                            <p class="text-sm text-gray-400">${rank.name}</p>
                        </div>
                    </div>
                    
                    <div class="bg-black/30 rounded-xl p-3">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-400">النقاط المطلوبة:</span>
                            <span class="font-black" style="font-family: 'Orbitron', sans-serif; color: ${rank.color};">
                                ${rank.min} - ${rank.max === Infinity ? '∞' : rank.max}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        Object.keys(ranks).forEach(key => {
            const holder = document.getElementById(`rankShowcaseIcon-${key}`);
            if (holder) holder.appendChild(window.NameThemes.createRankIcon(ranks[key].min, 48));
        });
    } catch (error) {
        console.error('خطأ في renderRanks:', error);
        grid.innerHTML = '<div class="col-span-full text-center text-red-400 p-4">حدث خطأ أثناء تحميل الرتب</div>';
    }
}
        
        // Purchase functions
        window.buyTheme = async function(themeKey) {
    try {
        if (!window.NameThemes || !window.NameThemes.themes) {
            showError('النظام غير جاهز، يرجى تحديث الصفحة');
            return;
        }
        
        const theme = window.NameThemes.themes[themeKey];
        if (!theme) {
            showError('الثيم غير موجود');
            return;
        }
        
        if (userCoins < theme.price) {
            showError('⚠️ ليس لديك عملات كافية!');
            return;
        }
        
        const ownedThemes = Array.isArray(userInventory.nameThemes) ? userInventory.nameThemes : ['default'];
        if (ownedThemes.includes(themeKey)) {
            showError('✅ أنت تمتلك هذا الثيم بالفعل!');
            return;
        }
        
        const newCoins = userCoins - theme.price;
        const newThemes = [...ownedThemes, themeKey];
        
        await update(ref(db, `players/${currentUser.uid}`), {
            coins: newCoins,
            'inventory/nameThemes': newThemes
        });
        
        userCoins = newCoins;
        userInventory.nameThemes = newThemes;
        
        document.getElementById('coinBalance').textContent = userCoins;
        renderThemes();
        
        alert(`✅ تم شراء "${theme.name}" بنجاح!`);
        hideError();
    } catch (error) {
        console.error('Purchase error:', error);
        showError('❌ حدث خطأ أثناء الشراء: ' + error.message);
    }
};

window.buyTag = async function(tagKey) {
    try {
        if (!window.NameThemes || !window.NameThemes.tags) {
            showError('النظام غير جاهز، يرجى تحديث الصفحة');
            return;
        }
        
        const tag = window.NameThemes.tags[tagKey];
        if (!tag) {
            showError('اللقب غير موجود');
            return;
        }
        
        if (tag.purchasable === false) {
            showError('🔒 هذا اللقب يُمنح إدارياً فقط ولا يمكن شراؤه من المتجر');
            return;
        }
        
        if (userCoins < tag.price) {
            showError('⚠️ ليس لديك عملات كافية!');
            return;
        }
        
        const ownedTags = Array.isArray(userInventory.nameTags) ? userInventory.nameTags : [];
        if (ownedTags.includes(tagKey)) {
            showError('✅ أنت تمتلك هذا اللقب بالفعل!');
            return;
        }
        
        const newCoins = userCoins - tag.price;
        const newTags = [...ownedTags, tagKey];
        
        await update(ref(db, `players/${currentUser.uid}`), {
            coins: newCoins,
            'inventory/nameTags': newTags
        });
        
        userCoins = newCoins;
        userInventory.nameTags = newTags;
        
        document.getElementById('coinBalance').textContent = userCoins;
        renderTags();
        
        alert(`✅ تم شراء "${tag.name}" بنجاح!`);
        hideError();
    } catch (error) {
        console.error('Purchase error:', error);
        showError('❌ حدث خطأ أثناء الشراء: ' + error.message);
    }
};

window.activateTheme = async function(themeKey) {
            try {
                await update(ref(db, `players/${currentUser.uid}`), { nameTheme: themeKey });
                const theme = window.NameThemes.themes[themeKey];
                alert(`✅ تم تفعيل ثيم "${theme.name}"! سيظهر اسمك بهذا الشكل في الغرفة.`);
            } catch (error) {
                showError('❌ فشل تفعيل الثيم: ' + error.message);
            }
        };

        window.activateTag = async function(tagKey) {
            try {
                // null = remove tag, anything else = set tag
                const current = await get(ref(db, `players/${currentUser.uid}/nameTag`));
                const isActive = current.val() === tagKey;
                await update(ref(db, `players/${currentUser.uid}`), { nameTag: isActive ? null : tagKey });
                const tag = window.NameThemes.tags[tagKey];
                alert(isActive ? `❌ تم إزالة اللقب "${tag.name}"` : `✅ تم تفعيل اللقب "${tag.name}"!`);
            } catch (error) {
                showError('❌ فشل تفعيل اللقب: ' + error.message);
            }
        };
        
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`tab-${tab}`).classList.remove('hidden');
            });
        });
    </script>
    
</body>
</html>
