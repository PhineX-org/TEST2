<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="../Assets/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الجاسوس">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المتصدرين | El Jasus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="../Assets/ElJasus.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/mobile.css">
    <script src="../Assets/sound-system.js" defer></script>
    <script src="../Assets/qr-notifications.js" defer></script>
    <script src="../Assets/friend-invite-enhanced.js" defer></script>
    <script src="../Assets/presence.js"></script>
    <script src="../Assets/dialogs.js"></script>
    <script src="../Assets/name-themes.js"></script>
    <script src="../Assets/inbox.js"></script>
    <style>
        :root { 
            --bg-color: #000000;
            --card-color: rgba(0, 0, 0, 0.95);
            --primary-color: #00f2ff;
            --secondary-color: #a3e635; /* was purple; aliased to lime for the black/cyan/lime system */
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #000000 0%, #000000 50%, #000000 100%);
            background-attachment: fixed;
            color: #ffffff; 
            min-height: 100vh; 
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Floating Particles */
        body::after {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 20% 30%, rgba(163, 230, 53, 0.3), transparent),
                              radial-gradient(2px 2px at 60% 70%, rgba(0, 242, 255, 0.3), transparent),
                              radial-gradient(1px 1px at 50% 50%, rgba(255, 255, 255, 0.2), transparent);
            background-size: 200% 200%;
            animation: particleFloat 15s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes particleFloat {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.6; transform: translateY(-20px); }
        }
        
        /* Glass Morphism */
        .glass { 
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.8));
            backdrop-filter: blur(20px);
            border: 2px solid;
            border-image: linear-gradient(135deg, rgba(0, 242, 255, 0.3), rgba(163, 230, 53, 0.3)) 1;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 30px rgba(0, 242, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(0, 242, 255, 0.05),
                transparent
            );
            animation: shimmer 3s infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .neon-text {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 
                0 0 10px rgba(0, 242, 255, 0.8),
                0 0 20px rgba(0, 242, 255, 0.6),
                0 0 30px rgba(0, 242, 255, 0.4);
        }

        /* Medal Styles */
        .medal-gold {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            animation: goldPulse 2s infinite;
        }

        .medal-silver {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.4);
        }

        .medal-bronze {
            background: linear-gradient(135deg, #cd7f32, #e09856);
            box-shadow: 0 0 20px rgba(205, 127, 50, 0.4);
        }

        @keyframes goldPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }
        }

        /* Rank Styles */
        .rank-1 {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
            border-color: rgba(255, 215, 0, 0.5) !important;
        }

        .rank-2 {
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.2), rgba(192, 192, 192, 0.1));
            border-color: rgba(192, 192, 192, 0.5) !important;
        }

        .rank-3 {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.2), rgba(205, 127, 50, 0.1));
            border-color: rgba(205, 127, 50, 0.5) !important;
        }

        /* Trophy Animation */
        .trophy-icon {
            animation: trophyFloat 3s ease-in-out infinite;
        }

        @keyframes trophyFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { 
            background: rgba(0, 242, 255, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        /* Stat Card */
        .stat-card {
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent,
                rgba(0, 242, 255, 0.1),
                transparent
            );
            animation: statShine 3s infinite;
        }

        @keyframes statShine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Badge Styles — spy=cyan, innocent=lime, matching the reveal-card
           color roles established elsewhere (was red/green) */
        .badge-spy {
            background: rgba(0, 242, 255, 0.9);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            color: #000;
        }

        .badge-innocent {
            background: rgba(163, 230, 53, 0.9);
            box-shadow: 0 0 15px rgba(163, 230, 53, 0.5);
            color: #000;
        }

        /* ── Leaderboard picker (dropdown) — styled after the Classic Edition list menu ── */
        .lb-picker{overflow:visible !important;position:relative;z-index:30}
        .lb-picker::before,.lb-picker::after{display:none !important}
        .lb-picker-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:22px}
        .lb-picker-label{font-size:11px;font-weight:900;letter-spacing:.08em;color:rgba(255,255,255,.5)}
        .lb-mypos{font-size:11px;font-weight:900;color:#000;background:#a3e635;border-radius:999px;padding:3px 10px}
        .lbdd{position:relative}
        .lbdd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:10px 16px;
            background:#000;color:#fff;border:2px solid #00f2ff;border-radius:14px;font:900 16px 'Cairo',sans-serif;cursor:pointer;text-align:right;
            box-shadow:0 0 0 1px rgba(0,0,0,.9),0 0 18px rgba(0,242,255,.18);transition:box-shadow .15s}
        .lbdd-btn:hover,.lbdd.open .lbdd-btn{box-shadow:0 0 0 1px rgba(0,0,0,.9),0 0 26px rgba(0,242,255,.35)}
        .lbdd-btn:focus-visible{outline:2px solid #a3e635;outline-offset:2px}
        .lbdd-cur{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .lbdd-caret{flex:none;color:#00f2ff;transition:transform .2s}
        .lbdd.open .lbdd-caret{transform:rotate(180deg)}
        .lbdd-list{position:absolute;z-index:60;top:calc(100% + 6px);right:0;left:0;margin:0;padding:6px 0;list-style:none;
            background:#f0ffff;color:#0b1f33;border-radius:10px;max-height:min(62vh,440px);overflow-y:auto;overscroll-behavior:contain;
            box-shadow:0 18px 50px rgba(0,0,0,.75),0 0 0 1px rgba(0,242,255,.35)}
        .lbdd-list[hidden]{display:none}
        .lbdd-grp{padding:9px 16px 4px;font:900 11px 'Cairo',sans-serif;letter-spacing:.06em;color:#5b7287;background:#f0ffff;position:sticky;top:0;z-index:1}
        .lbdd-grp:not(:first-child){border-top:1px solid rgba(11,31,51,.12);margin-top:4px}
        .lbdd-opt{display:flex;align-items:center;gap:8px;padding:11px 16px;font:700 15px 'Cairo',sans-serif;cursor:pointer;min-height:44px;user-select:none}
        .lbdd-opt:hover,.lbdd-opt.act{background:#1a6bd8;color:#fff}
        .lbdd-opt[aria-selected="true"]{font-weight:900}
        .lbdd-opt[aria-selected="true"]::after{content:'✓';margin-inline-start:auto;font-weight:900}
        .lbdd-opt.dim{color:#8aa0b3}

        /* selected board panel */
        .lb-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
        .lb-head-ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:rgba(0,242,255,.1);border:1px solid rgba(0,242,255,.35)}
        .lb-head-tx{flex:1;min-width:0}
        .lb-title{font-size:19px;font-weight:900;margin:0;line-height:1.3}
        .lb-desc{font-size:12px;color:rgba(255,255,255,.5);margin:2px 0 0;line-height:1.5}
        .lb-badge{flex:none;font-size:10px;font-weight:900;letter-spacing:.08em;padding:6px 12px;border-radius:999px;background:rgba(0,242,255,.9);color:#000;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .lb-tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px;margin-bottom:14px}
        .lb-tier{display:block;width:100%;text-align:center;padding:6px 2px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.03);font-family:'Cairo',sans-serif;color:inherit}
        .lb-tier b{display:block;font:900 10px 'Orbitron',sans-serif}
        .lb-tier span{display:block;font:900 16px 'Orbitron',sans-serif}
        .lb-list{display:flex;flex-direction:column;gap:8px;max-height:640px;overflow-y:auto;padding-inline-end:2px}
        .lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:border-color .15s,background .15s;width:100%;text-align:right;color:inherit;font-family:'Cairo',sans-serif}
        .lb-row:hover{border-color:rgba(0,242,255,.5);background:rgba(0,242,255,.05)}
        .lb-row.me{border-color:#a3e635;background:rgba(163,230,53,.07)}
        .lb-pos{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:900 15px 'Orbitron',sans-serif;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
        .lb-pos.p1{background:linear-gradient(135deg,#ffd700,#ffed4e);color:#000;border-color:transparent;box-shadow:0 0 18px rgba(255,215,0,.45)}
        .lb-pos.p2{background:linear-gradient(135deg,#c0c0c0,#e8e8e8);color:#000;border-color:transparent}
        .lb-pos.p3{background:linear-gradient(135deg,#cd7f32,#e09856);color:#000;border-color:transparent}
        .lb-mid{flex:1;min-width:0}
        .lb-name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
        .lb-sub{font-size:11px;color:rgba(255,255,255,.5);font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .lb-val{flex:none;text-align:left;min-width:56px}
        .lb-val b{display:block;font:900 19px 'Orbitron',sans-serif;color:#00f2ff;line-height:1.1}
        .lb-val small{display:block;font-size:9px;color:rgba(255,255,255,.45);font-weight:800;letter-spacing:.06em;margin-top:2px}
        .lb-you{font-size:9px;font-weight:900;color:#000;background:#a3e635;border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
        .lb-empty{text-align:center;padding:44px 12px;color:rgba(255,255,255,.5)}
        .lb-empty .e{font-size:42px;display:block;margin-bottom:8px}
        .lb-empty a,.lb-empty button{display:inline-block;margin-top:12px;padding:9px 20px;border-radius:10px;background:#00f2ff;color:#000;font-weight:900;font-size:13px}
        .lb-foot{margin:12px 0 0;font-size:11px;color:rgba(255,255,255,.35);text-align:center}
        @media(max-width:639px){
            .lb-stats.grid{grid-template-columns:repeat(3,1fr) !important}
            .lb-stats .stat-card{padding:10px 8px !important;border-radius:14px !important}
            .lb-stats .stat-card>div{flex-direction:column-reverse;align-items:flex-start !important;gap:6px;justify-content:flex-start !important}
            .lb-stats .stat-card .rounded-full{display:none !important}
            .lb-stats .stat-card h3{font-size:18px !important;max-width:100% !important}
            .lb-stats .stat-card p{font-size:9px !important;margin:0 !important}
        }
        @media(max-width:420px){.lb-row{gap:8px;padding:9px 10px}.lb-badge{display:none}.lb-title{font-size:17px}}
        /* Palette utility classes — replace the old red/purple/green Tailwind
           swatches so every color traces back to the same cyan/lime tokens
           used across the rest of the site. spy=cyan, innocent=lime,
           total=neutral (it isn't a competing "side", so no accent hue). */
        .u-cyan   { color: #00f2ff !important; }
        .u-lime   { color: #a3e635 !important; }
        .u-bg-cyan   { background: rgba(0, 242, 255, 0.2) !important; }
        .u-bg-lime   { background: rgba(163, 230, 53, 0.2) !important; }
        .u-bg-neutral{ background: rgba(255, 255, 255, 0.08) !important; }
        .u-border-cyan { border-color: rgba(0, 242, 255, 0.3) !important; }
        .u-border-lime { border-color: rgba(163, 230, 53, 0.3) !important; }
        .u-border-neutral { border-color: rgba(255, 255, 255, 0.15) !important; }
    </style>
</head>
<body class="p-4 pb-10">

    <!-- Header -->
    <header class="max-w-6xl mx-auto mb-6 relative z-10">
        <div class="flex items-center justify-between">
            <!-- Back Button -->
            <a href="home.html" class="flex items-center gap-2 text-gray-400 hover:u-cyan transition-all hover:translate-x-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span class="text-sm font-bold">رجوع</span>
            </a>
            
            <!-- Title -->
            <div class="text-center flex-1">
                <div class="flex items-center justify-center gap-3 mb-2">
                    <svg class="w-10 h-10 text-yellow-500 trophy-icon" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/>
                    </svg>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-tight neon-text">
                    لوحة المتصدرين
                </h1>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mt-1" style="font-family: 'Orbitron', sans-serif;">HALL OF FAME</p>
            </div>

            <!-- Refresh Button -->
            <button id="refreshBtn" class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#00f2ff]/20 to-white/10 border-2 u-border-cyan flex items-center justify-center hover:scale-110 transition-all group">
                <svg class="w-5 h-5 u-cyan group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto relative z-10">
        
        <!-- Stats Overview -->
        <div class="lb-stats grid grid-cols-3 gap-2 sm:gap-4 mb-5">
            
            <!-- Total Players -->
            <div class="glass rounded-2xl p-5 stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] font-bold opacity-50 uppercase tracking-wider mb-1" style="font-family: 'Orbitron', sans-serif;">إجمالي اللاعبين</p>
                        <h3 id="totalPlayers" class="text-3xl font-black u-cyan" style="font-family: 'Orbitron', sans-serif;">0</h3>
                    </div>
                    <div class="w-16 h-16 rounded-full u-bg-cyan border-2 u-border-cyan flex items-center justify-center">
                        <svg class="w-8 h-8 u-cyan" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Total Games -->
            <div class="glass rounded-2xl p-5 stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] font-bold opacity-50 uppercase tracking-wider mb-1" style="font-family: 'Orbitron', sans-serif;">إجمالي المباريات</p>
                        <h3 id="totalGames" class="text-3xl font-black text-white" style="font-family: 'Orbitron', sans-serif;">0</h3>
                    </div>
                    <div class="w-16 h-16 rounded-full u-bg-neutral border-2 u-border-neutral flex items-center justify-center">
                        <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M11 17a1 1 0 001.447.894l4-2A1 1 0 0017 15V9.236a1 1 0 00-1.447-.894l-4 2a1 1 0 00-.553.894V17zM15.211 6.276a1 1 0 000-1.788l-4.764-2.382a1 1 0 00-.894 0L4.789 4.488a1 1 0 000 1.788l4.764 2.382a1 1 0 00.894 0l4.764-2.382zM4.447 8.342A1 1 0 003 9.236V15a1 1 0 00.553.894l4 2A1 1 0 009 17v-5.764a1 1 0 00-.553-.894l-4-2z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Best Spy -->
            <div class="glass rounded-2xl p-5 stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[10px] font-bold opacity-50 uppercase tracking-wider mb-1" style="font-family: 'Orbitron', sans-serif;">أفضل جاسوس</p>
                        <h3 id="bestSpy" class="text-lg font-black u-cyan truncate max-w-[150px]">---</h3>
                    </div>
                    <div class="w-16 h-16 rounded-full u-bg-cyan border-2 u-border-cyan flex items-center justify-center">
                        <svg class="w-8 h-8 u-cyan" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Board picker (dropdown) -->
        <div class="lb-picker glass rounded-2xl p-4 mb-5">
            <div class="lb-picker-top">
                <span class="lb-picker-label">اختر لوحة المتصدرين</span>
                <span id="lbMyPos" class="lb-mypos" hidden></span>
            </div>
            <div class="lbdd" id="lbdd">
                <button type="button" class="lbdd-btn" id="lbddBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="lbddList">
                    <span class="lbdd-cur" id="lbddCur">🌍 الترتيب العام</span>
                    <svg class="lbdd-caret" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <ul class="lbdd-list" id="lbddList" role="listbox" tabindex="-1" aria-label="لوحات المتصدرين" hidden></ul>
            </div>
        </div>

        <!-- Selected board -->
        <section class="glass rounded-3xl p-4 sm:p-6" aria-live="polite">
            <div class="lb-head">
                <div class="lb-head-ic" id="lbHeadIc">🌍</div>
                <div class="lb-head-tx">
                    <h2 id="lbTitle" class="lb-title">الترتيب العام</h2>
                    <p id="lbDesc" class="lb-desc"></p>
                </div>
                <span id="lbBadge" class="lb-badge" style="font-family:'Orbitron',sans-serif;">GLOBAL</span>
            </div>
            <div id="lbTiers" class="lb-tiers" hidden></div>
            <div id="lbList" class="lb-list custom-scrollbar">
                <div class="skeleton rounded-xl h-16"></div>
                <div class="skeleton rounded-xl h-16"></div>
                <div class="skeleton rounded-xl h-16"></div>
            </div>
            <p class="lb-foot" id="lbFoot"></p>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

        function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        
const firebaseConfig = {
  apiKey: "AIzaSyDnd-pmKEatI3DaFz6xHWB5ucurtHXt9tk",
  authDomain: "el-jasus.firebaseapp.com",
  databaseURL: "https://el-jasus-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "el-jasus",
  storageBucket: "el-jasus.firebasestorage.app",
  messagingSenderId: "415659587906",
  appId: "1:415659587906:web:782f7940176ea4097eb0db",
  measurementId: "G-N4K79FP56N"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        window._firebaseFns = { ref, get, onValue };

        let allPlayers = [];
        let myUid = null;
        let myFriends = {};
        let loadTimeoutHandle = null;
        let currentBoard = 'global';
        let loaded = false;

        const TIERS = [
            { key: 'Ace',      min: 7500, ar: 'ايس',      color: '#ffffff', emoji: '🌟' },
            { key: 'Crown',    min: 6500, ar: 'كراون',    color: '#ffd700', emoji: '👑' },
            { key: 'Diamond',  min: 5000, ar: 'الماس',    color: '#00f2ff', emoji: '💎' },
            { key: 'Platinum', min: 3000, ar: 'بلاتينيوم', color: '#e5e4e2', emoji: '🔷' },
            { key: 'Gold',     min: 2000, ar: 'ذهبي',     color: '#ffd700', emoji: '🥇' },
            { key: 'Silver',   min: 1000, ar: 'فضي',      color: '#c0c0c0', emoji: '🥈' },
            { key: 'Bronze',   min: 0,    ar: 'برونزي',   color: '#cd7f32', emoji: '🥉' }
        ];
        const tierOf = (pts) => TIERS.find(t => pts >= t.min) || TIERS[TIERS.length - 1];
        const MIN_GAMES_RATE = 10;

        // ── Board catalogue ─────────────────────────────────────
        // Each board: how to filter, how to sort, what number to show.
        const BOARDS = [
            { group: 'عام' },
            { id: 'global',   emoji: '🌍', label: 'الترتيب العام',          badge: 'GLOBAL',   desc: 'كل اللاعبين مرتبين حسب نقاط الرتبة',
              sort: p => p.rankPoints, val: p => p.rankPoints, unit: 'نقطة' },
            { id: 'spy',      emoji: '🕵️', label: 'انتصارات الجواسيس',      badge: 'SPY WINS', desc: 'أكثر اللاعبين فوزاً كجاسوس',
              filter: p => p.spyWins > 0, sort: p => p.spyWins, val: p => p.spyWins, unit: 'فوز' },
            { id: 'innocent', emoji: '🛡️', label: 'انتصارات الأبرياء',      badge: 'INNOCENT', desc: 'أكثر اللاعبين فوزاً كبريء',
              filter: p => p.innocentWins > 0, sort: p => p.innocentWins, val: p => p.innocentWins, unit: 'فوز' },
            { id: 'games',    emoji: '🎮', label: 'الأكثر لعباً',            badge: 'GAMES',    desc: 'إجمالي المباريات التي لُعبت',
              filter: p => p.totalGames > 0, sort: p => p.totalGames, val: p => p.totalGames, unit: 'مباراة' },
            { id: 'winrate',  emoji: '📈', label: 'أعلى نسبة فوز',          badge: 'WIN RATE', desc: 'لاعبون أنهوا ' + MIN_GAMES_RATE + ' مباريات أو أكثر',
              filter: p => p.totalGames >= MIN_GAMES_RATE, sort: p => p.winRate, val: p => p.winRate + '%', unit: 'نسبة الفوز' },
            { id: 'streak',   emoji: '🔥', label: 'أطول سلسلة انتصارات',     badge: 'STREAK',   desc: 'أطول عدد انتصارات متتالية',
              filter: p => p.longestStreak > 0, sort: p => p.longestStreak, val: p => p.longestStreak, unit: 'متتالية' },
            { group: 'الأصدقاء' },
            { id: 'friends',  emoji: '👥', label: 'أفضل أصدقائي',            badge: 'FRIENDS',  desc: 'أنت وأصدقاؤك مرتبون حسب نقاط الرتبة', needsLogin: true,
              filter: p => p.uid === myUid || !!myFriends[p.uid], sort: p => p.rankPoints, val: p => p.rankPoints, unit: 'نقطة' },
            { group: 'حسب الرتبة' },
            ...TIERS.map(t => ({
              id: 'tier-' + t.key.toLowerCase(), tier: t, emoji: t.emoji, label: 'أفضل رتبة ' + t.ar + ' (' + t.key + ')', badge: t.key.toUpperCase(),
              desc: 'لاعبو رتبة ' + t.key + ' فقط مرتبين حسب النقاط',
              filter: p => tierOf(p.rankPoints).key === t.key, sort: p => p.rankPoints, val: p => p.rankPoints, unit: 'نقطة'
            }))
        ];
        const BOARD_BY_ID = Object.fromEntries(BOARDS.filter(b => b.id).map(b => [b.id, b]));

        // ── Dropdown ────────────────────────────────────────────
        const dd = document.getElementById('lbdd'), ddBtn = document.getElementById('lbddBtn'),
              ddList = document.getElementById('lbddList'), ddCur = document.getElementById('lbddCur');
        let activeIdx = -1;

        function buildMenu() {
            ddList.innerHTML = BOARDS.map(b => b.group
                ? `<li class="lbdd-grp" role="presentation">${esc(b.group)}</li>`
                : `<li class="lbdd-opt" role="option" id="lbo-${b.id}" data-id="${b.id}" aria-selected="${b.id === currentBoard}">${b.emoji} ${esc(b.label)}</li>`
            ).join('');
        }
        const opts = () => [...ddList.querySelectorAll('.lbdd-opt')];
        function setActive(i) {
            const o = opts(); if (!o.length) return;
            activeIdx = (i + o.length) % o.length;
            o.forEach((el, k) => el.classList.toggle('act', k === activeIdx));
            o[activeIdx].scrollIntoView({ block: 'nearest' });
            ddBtn.setAttribute('aria-activedescendant', o[activeIdx].id);
        }
        function openMenu() {
            ddList.hidden = false; dd.classList.add('open'); ddBtn.setAttribute('aria-expanded', 'true');
            setActive(opts().findIndex(o => o.dataset.id === currentBoard));
        }
        function closeMenu(focusBtn) {
            ddList.hidden = true; dd.classList.remove('open'); ddBtn.setAttribute('aria-expanded', 'false');
            ddBtn.removeAttribute('aria-activedescendant'); activeIdx = -1;
            ddList.querySelectorAll('.act').forEach(e => e.classList.remove('act'));
            if (focusBtn) ddBtn.focus();
        }
        ddBtn.addEventListener('click', () => ddList.hidden ? openMenu() : closeMenu());
        ddBtn.addEventListener('keydown', (e) => {
            const open = !ddList.hidden;
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!open) openMenu(); else setActive(activeIdx + (e.key === 'ArrowDown' ? 1 : -1)); }
            else if ((e.key === 'Enter' || e.key === ' ') && open && activeIdx >= 0) { e.preventDefault(); selectBoard(opts()[activeIdx].dataset.id); closeMenu(true); }
            else if (e.key === 'Escape' && open) { e.preventDefault(); closeMenu(true); }
            else if (e.key === 'Home' && open) { e.preventDefault(); setActive(0); }
            else if (e.key === 'End' && open) { e.preventDefault(); setActive(opts().length - 1); }
        });
        ddList.addEventListener('click', (e) => { const li = e.target.closest('.lbdd-opt'); if (li) { selectBoard(li.dataset.id); closeMenu(true); } });
        ddList.addEventListener('mousemove', (e) => { const li = e.target.closest('.lbdd-opt'); if (li) setActive(opts().indexOf(li)); });
        document.addEventListener('mousedown', (e) => { if (!dd.contains(e.target)) closeMenu(); });
        document.addEventListener('focusin', (e) => { if (!dd.contains(e.target)) closeMenu(); });

        function selectBoard(id, silent) {
            if (!BOARD_BY_ID[id]) id = 'global';
            currentBoard = id;
            const b = BOARD_BY_ID[id];
            ddCur.textContent = b.emoji + ' ' + b.label;
            ddList.querySelectorAll('.lbdd-opt').forEach(o => o.setAttribute('aria-selected', String(o.dataset.id === id)));
            try { localStorage.setItem('eljasus_lb_board', id); } catch (e) {}
            if (!silent) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
            renderBoard();
        }

        // ── Data ────────────────────────────────────────────────
        function calculateWinRate(stats) {
            if (!stats || !stats.totalGames) return 0;
            const w = (stats.spyWins || 0) + (stats.innocentWins || 0);
            return Math.round((w / stats.totalGames) * 1000) / 10;
        }

        async function fetchLeaderboard() {
            if (loadTimeoutHandle) clearTimeout(loadTimeoutHandle);
            loadTimeoutHandle = setTimeout(() => showLoadError('استغرق التحميل وقتاً طويلاً. تحقق من اتصالك وحاول مجدداً.'), 12000);
            onValue(ref(db, 'players'), (snapshot) => {
                if (loadTimeoutHandle) { clearTimeout(loadTimeoutHandle); loadTimeoutHandle = null; }
                const data = snapshot.val() || {};
                allPlayers = [];
                Object.keys(data).forEach(uid => {
                    const p = data[uid];
                    if (!p || !p.username) return;
                    const st = p.stats || {};
                    allPlayers.push({
                        uid, username: p.username || 'مجهول',
                        nameTheme: p.nameTheme || 'default', nameTag: p.nameTag || null,
                        rankPoints: Number(p.rankPoints) || 0,
                        spyWins: st.spyWins || 0, innocentWins: st.innocentWins || 0, totalGames: st.totalGames || 0,
                        longestStreak: st.longestWinStreak || 0, winRate: calculateWinRate(st)
                    });
                });
                myFriends = (myUid && data[myUid] && data[myUid].friends) || {};
                loaded = true;
                updateStats();
                buildMenu(); selectBoard(currentBoard, true);
            }, (error) => {
                console.error('[leaderboard] players read failed:', error.code, error.message);
                showLoadError(`${error.code || ''} ${error.message || ''}`.trim());
            });
        }
        window.fetchLeaderboard = fetchLeaderboard;

        function showLoadError(message) {
            if (loadTimeoutHandle) { clearTimeout(loadTimeoutHandle); loadTimeoutHandle = null; }
            document.getElementById('lbList').innerHTML = `
                <div class="lb-empty">
                    <span class="e">⚠️</span>
                    <p class="font-black" style="color:#f87171">تعذّر تحميل البيانات</p>
                    <p class="text-xs" style="opacity:.6">${esc(message || '')}</p>
                    <button type="button" onclick="fetchLeaderboard()">إعادة المحاولة</button>
                </div>`;
        }

        function updateStats() {
            document.getElementById('totalPlayers').innerText = allPlayers.length;
            document.getElementById('totalGames').innerText = allPlayers.reduce((s, p) => s + p.totalGames, 0);
            const topSpy = [...allPlayers].sort((a, b) => b.spyWins - a.spyWins)[0];
            document.getElementById('bestSpy').innerText = topSpy && topSpy.spyWins ? topSpy.username : '---';
        }

        // ── Render the selected board ───────────────────────────
        function renderBoard() {
            const b = BOARD_BY_ID[currentBoard];
            document.getElementById('lbTitle').textContent = b.label;
            document.getElementById('lbDesc').textContent = b.desc;
            document.getElementById('lbHeadIc').textContent = b.emoji;
            document.getElementById('lbBadge').textContent = b.badge;
            const list = document.getElementById('lbList'), tiers = document.getElementById('lbTiers');
            const mypos = document.getElementById('lbMyPos'), foot = document.getElementById('lbFoot');
            mypos.hidden = true; foot.textContent = '';

            // rank boards show a clickable strip of tier counts
            const isRank = currentBoard === 'global' || !!b.tier;
            if (isRank && loaded) {
                const counts = {}; TIERS.forEach(t => counts[t.key] = 0);
                allPlayers.forEach(p => counts[tierOf(p.rankPoints).key]++);
                tiers.hidden = false;
                tiers.innerHTML = TIERS.map(t => {
                    const on = b.tier && b.tier.key === t.key;
                    return `<button type="button" class="lb-tier" data-board="tier-${t.key.toLowerCase()}" style="border:2px solid ${t.color}${on ? 'cc' : '44'};background:${t.color}${on ? '22' : '0d'}">
                        <b style="color:${t.color}">${t.key}</b><span style="color:${t.color}">${counts[t.key]}</span></button>`;
                }).join('');
            } else tiers.hidden = true;

            if (!loaded) return;

            if (b.needsLogin && !myUid) {
                list.innerHTML = `<div class="lb-empty"><span class="e">🔒</span><p class="font-black">سجّل دخولك لرؤية ترتيب أصدقائك</p><a href="login.html">تسجيل الدخول</a></div>`;
                return;
            }

            const base = allPlayers.filter(p => (b.filter ? b.filter(p) : true));
            const ranked = base.sort((x, y) => b.sort(y) - b.sort(x) || y.rankPoints - x.rankPoints || x.username.localeCompare(y.username, 'ar'));
            const top = ranked.slice(0, 50);

            if (!ranked.length) {
                const msg = currentBoard === 'friends'
                    ? `<p class="font-black">لا يوجد أصدقاء بعد</p><a href="friends.html">إضافة أصدقاء</a>`
                    : `<p class="font-black">لا يوجد لاعبون في هذه اللوحة بعد</p><p class="text-xs" style="opacity:.6">كن أول من يظهر هنا!</p>`;
                list.innerHTML = `<div class="lb-empty"><span class="e">${b.emoji}</span>${msg}</div>`;
                return;
            }

            list.innerHTML = top.map((p, i) => {
                const pos = i + 1, t = tierOf(p.rankPoints), me = p.uid === myUid;
                const sub = `مباريات ${p.totalGames} · فوز ${p.winRate}%`;
                return `<button type="button" class="lb-row${me ? ' me' : ''}" data-uid="${esc(p.uid)}" data-name="${esc(p.username)}">
                    <span class="lb-pos ${pos <= 3 ? 'p' + pos : ''}">${pos}</span>
                    <span class="lb-mid"><span class="lb-name" data-i="${i}">${esc(p.username)}</span>${me ? '<span class="lb-you">أنت</span>' : ''}<div class="lb-sub">${esc(sub)}</div></span>
                    <span class="lb-val"><b>${esc(b.val(p))}</b><small>${esc(b.unit)}</small></span>
                </button>`;
            }).join('');

            // themed names (name themes + tags) when the helper is available
            if (window.NameThemes && window.NameThemes.applyPlayerStyle) {
                list.querySelectorAll('.lb-name').forEach(el => {
                    const p = top[+el.dataset.i]; if (!p) return;
                    try { el.innerHTML = ''; window.NameThemes.applyPlayerStyle(el, { username: p.username, nameTheme: p.nameTheme, nameTag: p.nameTag, rankPoints: p.rankPoints }); }
                    catch (e) { el.textContent = p.username; }
                });
            }

            // "my position" chip
            if (myUid) {
                const idx = ranked.findIndex(p => p.uid === myUid);
                if (idx >= 0) { mypos.hidden = false; mypos.textContent = 'مركزك: #' + (idx + 1) + ' من ' + ranked.length; }
            }
            if (ranked.length > 50) foot.textContent = 'يُعرض أفضل 50 لاعباً';
        }

        document.getElementById('lbTiers').addEventListener('click', (e) => { const t = e.target.closest('.lb-tier'); if (t) selectBoard(t.dataset.board); });
        document.getElementById('lbList').addEventListener('click', (e) => {
            const r = e.target.closest('.lb-row'); if (!r) return;
            if (window.ProfileViewer && window.ProfileViewer.open) window.ProfileViewer.open(r.dataset.uid, r.dataset.name);
        });

        // Refresh Button
        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchLeaderboard();
        });

        // Initialize — auth first. Every other page in this app either has
        // a logged-in session or falls back to Firebase anonymous auth
        // before reading the database, because the security rules require
        // auth != null to read players. This page never did either, so
        // reads silently failed and nothing ever replaced the skeletons.
        (function pickInitial() {
            let id = (location.hash || '').replace('#', '');
            if (!BOARD_BY_ID[id]) { try { id = localStorage.getItem('eljasus_lb_board') || ''; } catch (e) { id = ''; } }
            if (BOARD_BY_ID[id]) currentBoard = id;
            buildMenu();
            const b = BOARD_BY_ID[currentBoard];
            ddCur.textContent = b.emoji + ' ' + b.label;
        })();
        window.addEventListener('hashchange', () => { const id = location.hash.replace('#', ''); if (BOARD_BY_ID[id] && id !== currentBoard) selectBoard(id, true); });

        let started = false;
        onAuthStateChanged(auth, (user) => {
            myUid = user && !user.isAnonymous ? user.uid : null;
            if (user) {
                if (!started) { started = true; fetchLeaderboard(); }
                else if (loaded) renderBoard();
            } else {
                signInAnonymously(auth).catch((err) => {
                    console.warn('[leaderboard] anonymous auth failed:', err && err.code);
                    if (!started) { started = true; fetchLeaderboard(); }
                });
            }
        });
    </script>
<script>
    window.alert   = (msg)             => UIAlert ? UIAlert(msg) : alert(msg);
    window.confirm = (msg)             => UIConfirm ? UIConfirm(msg) : confirm(msg);
    window.prompt  = (msg, defaultVal) => UIPrompt ? UIPrompt(msg, { defaultValue: defaultVal }) : prompt(msg, defaultVal);
</script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../Assets/sw.js').catch(()=>{}));}</script>
    <script src="../Assets/tutorial.js" defer></script>
</body>
