<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الجاسوس">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المتصدرين | El Jasus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="ElJasus.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mobile.css">
    <script src="sound-system.js" defer></script>
    <script src="qr-notifications.js" defer></script>
    <script src="dialogs.js"></script>
    <script src="moderation.js"></script>
    <script src="name-themes.js"></script>
    <style>
        :root {
            --bg-color: #0a0e1a;
            --primary: #00f2ff;
            --secondary: #7c30ff;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(160deg, #060a12 0%, #0f0c1d 55%, #0a0e1a 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 46px 46px;
            pointer-events: none;
            z-index: 0;
        }

        .neon-text {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.7), 0 0 24px rgba(0, 242, 255, 0.35);
        }

        .glass {
            background: linear-gradient(150deg, rgba(15, 20, 35, 0.9), rgba(22, 26, 46, 0.75));
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ── Segmented pill tab bar ───────────────────────────── */
        .segtabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 4px;
        }

        .segtab {
            padding: 10px 4px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 900;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.25s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .segtab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #06111a;
            box-shadow: 0 4px 18px rgba(0, 242, 255, 0.35);
        }

        /* ── Stat strip ────────────────────────────────────────── */
        .stat-chip {
            flex: 1 1 0;
            min-width: 120px;
            border-radius: 16px;
            padding: 12px 14px;
        }

        /* ── Podium ────────────────────────────────────────────── */
        .podium-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: end;
            gap: 8px;
        }

        .podium-avatar {
            width: 54px;
            height: 54px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 22px;
            margin: 0 auto 8px;
            border: 3px solid;
            position: relative;
        }

        .podium-avatar.first { width: 68px; height: 68px; font-size: 26px; }

        .podium-medal {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.6));
        }

        .podium-block {
            border-radius: 16px 16px 0 0;
            padding: 10px 6px 14px;
            text-align: center;
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .podium-first-wrap { animation: floatY 3s ease-in-out infinite; }

        /* ── List rows ─────────────────────────────────────────── */
        .lb-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            border-right: 3px solid transparent;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.2s ease;
        }
        .lb-row:hover { background: rgba(255, 255, 255, 0.05); }

        .lb-pos {
            width: 26px;
            flex-shrink: 0;
            text-align: center;
            font-weight: 900;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron', sans-serif;
        }

        .lb-avatar {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            background: linear-gradient(135deg, rgba(0,242,255,0.25), rgba(124,48,255,0.25));
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* ── Skeleton ──────────────────────────────────────────── */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmerMove 1.4s infinite;
        }
        @keyframes shimmerMove {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 10px;
        }

        .tier-chip {
            border-radius: 14px;
            padding: 8px 4px;
            text-align: center;
            border: 1.5px solid;
        }

        .rank-icon-sm img, .rank-icon-sm .ej-rank-icon-wrap { width: 300%; height: 300%; }
    </style>
</head>
<body class="p-3 pb-10">

    <!-- Header -->
    <header class="max-w-4xl mx-auto mb-4 relative z-10">
        <div class="flex items-center justify-between">
            <a href="home.html" class="flex items-center gap-2 text-gray-400 hover:text-cyan-400 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span class="text-sm font-bold">رجوع</span>
            </a>

            <div class="text-center">
                <h1 class="text-2xl font-black uppercase tracking-tight neon-text">لوحة المتصدرين</h1>
                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-wider" style="font-family:'Orbitron',sans-serif;">HALL OF FAME</p>
            </div>

            <button id="refreshBtn" class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500/15 to-purple-500/15 border border-cyan-500/30 flex items-center justify-center hover:scale-110 transition-all">
                <i class="fas fa-rotate text-cyan-400 text-sm" id="refreshIcon"></i>
            </button>
        </div>
    </header>

    <div class="max-w-4xl mx-auto relative z-10">

        <!-- Stat strip -->
        <div class="flex gap-3 mb-4 overflow-x-auto custom-scrollbar pb-1">
            <div class="glass stat-chip">
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-wider mb-1">اللاعبون</p>
                <h3 id="totalPlayers" class="text-2xl font-black text-cyan-400" style="font-family:'Orbitron',sans-serif;">–</h3>
            </div>
            <div class="glass stat-chip">
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-wider mb-1">إجمالي المباريات</p>
                <h3 id="totalGames" class="text-2xl font-black text-purple-400" style="font-family:'Orbitron',sans-serif;">–</h3>
            </div>
            <div class="glass stat-chip">
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-wider mb-1">أفضل جاسوس</p>
                <h3 id="bestSpy" class="text-base font-black text-red-400 truncate">–</h3>
            </div>
        </div>

        <!-- Tabs -->
        <div class="segtabs mb-4">
            <button class="segtab active" data-tab="rank" onclick="switchTab('rank')">الرتب</button>
            <button class="segtab" data-tab="spy" onclick="switchTab('spy')">الجواسيس</button>
            <button class="segtab" data-tab="innocent" onclick="switchTab('innocent')">الأبرياء</button>
            <button class="segtab" data-tab="total" onclick="switchTab('total')">المباريات</button>
        </div>

        <!-- Loading state -->
        <div id="loadingState" class="space-y-3">
            <div class="skeleton rounded-2xl h-28"></div>
            <div class="skeleton rounded-xl h-16"></div>
            <div class="skeleton rounded-xl h-16"></div>
            <div class="skeleton rounded-xl h-16"></div>
        </div>

        <!-- Error state -->
        <div id="errorState" class="hidden glass rounded-2xl p-8 text-center border-2 border-red-500/30">
            <i class="fas fa-triangle-exclamation text-4xl text-red-400 mb-4 block"></i>
            <p class="text-lg text-red-400 font-black mb-1">تعذّر تحميل لوحة المتصدرين</p>
            <p id="errorMsg" class="text-sm text-gray-400 mb-6">تحقق من اتصالك بالإنترنت وحاول مجدداً</p>
            <button onclick="retryLoad()" class="px-8 py-3 bg-red-500/15 border-2 border-red-500/40 rounded-xl text-sm font-black text-red-400 hover:bg-red-500/25 transition-all">
                <i class="fas fa-rotate-right ml-2"></i>إعادة المحاولة
            </button>
        </div>

        <!-- Main content -->
        <div id="mainContent" class="hidden">

            <!-- RANK TAB -->
            <div id="panel-rank" class="tab-panel">
                <div class="glass rounded-2xl p-4 mb-4 flex items-center justify-between">
                    <div>
                        <p id="seasonName" class="text-cyan-400 text-sm font-black"></p>
                        <p id="seasonDates" class="text-gray-500 text-[11px]"></p>
                    </div>
                    <i class="fas fa-trophy text-yellow-400 text-xl"></i>
                </div>

                <div id="tierDistribution" class="grid grid-cols-5 gap-2 mb-4"></div>

                <div id="rankList" class="space-y-2"></div>
            </div>

            <!-- SPY TAB -->
            <div id="panel-spy" class="tab-panel hidden"></div>

            <!-- INNOCENT TAB -->
            <div id="panel-innocent" class="tab-panel hidden"></div>

            <!-- TOTAL TAB -->
            <div id="panel-total" class="tab-panel hidden"></div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnd-pmKEatI3DaFz6xHWB5ucurtHXt9tk",
            authDomain: "el-jasus.firebaseapp.com",
            databaseURL: "https://el-jasus-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "el-jasus",
            storageBucket: "el-jasus.firebasestorage.app",
            messagingSenderId: "415659587906",
            appId: "1:415659587906:web:782f7940176ea4097eb0db",
            measurementId: "G-N4K79FP56N"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getDatabase(app);
        window._firebaseFns = { ref, get, onValue };

        let allPlayers = [];
        let activeTab = 'rank';
        let unsubscribed = false;
        let loadTimeoutHandle = null;
        let playersListener = null;

        // ═══════════════════════════════════════════════════════
        // STATE HELPERS — loading / error / content are mutually
        // exclusive, and every code path below is guaranteed to
        // land on one of them (that's the fix for the infinite
        // "loading forever" bug: nothing was ever authenticating,
        // so the old onValue callback never fired and never left
        // the loading state).
        // ═══════════════════════════════════════════════════════
        function showLoading() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('errorState').classList.add('hidden');
            document.getElementById('mainContent').classList.add('hidden');
        }
        function showError(msg) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
            if (msg) document.getElementById('errorMsg').textContent = msg;
            if (loadTimeoutHandle) { clearTimeout(loadTimeoutHandle); loadTimeoutHandle = null; }
        }
        function showContent() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorState').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            if (loadTimeoutHandle) { clearTimeout(loadTimeoutHandle); loadTimeoutHandle = null; }
        }

        window.switchTab = (tab) => {
            activeTab = tab;
            document.querySelectorAll('.segtab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(`panel-${tab}`).classList.remove('hidden');
        };

        window.retryLoad = () => {
            startListening();
        };

        // ═══════════════════════════════════════════════════════
        // AUTH — every other page in this app (home, onlinerooms,
        // room) either logs the user in or falls back to Firebase
        // anonymous auth before touching the database, because the
        // security rules require auth != null to read. This page
        // never did either, so reads silently failed and the
        // skeletons never went away. Fixed here the same way.
        // ═══════════════════════════════════════════════════════
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (window.MOD) {
                    try {
                        await MOD.init(db, user);
                        if (document.getElementById('_ej_ban')) return;
                    } catch (e) { /* moderation system is optional here */ }
                }
                startListening();
            } else {
                signInAnonymously(auth).catch((err) => {
                    console.warn('[leaderboard] anonymous auth failed:', err && err.code);
                    // Still try — some rule sets allow open reads even
                    // without auth. If they don't, the onValue error
                    // handler below will show a clear error instead of
                    // hanging forever.
                    startListening();
                });
            }
        });

        function startListening() {
            showLoading();

            if (playersListener) {
                try { playersListener(); } catch (e) {}
                playersListener = null;
            }

            // Safety net: if nothing resolves within 12s (rules issue,
            // network stall, etc.) surface an error instead of leaving
            // the skeletons spinning forever.
            if (loadTimeoutHandle) clearTimeout(loadTimeoutHandle);
            loadTimeoutHandle = setTimeout(() => {
                showError('استغرق التحميل وقتاً طويلاً. تحقق من اتصالك وحاول مجدداً.');
            }, 12000);

            const playersRef = ref(db, 'players');
            playersListener = onValue(playersRef, (snapshot) => {
                const data = snapshot.val();
                allPlayers = [];

                if (data) {
                    Object.keys(data).forEach((uid) => {
                        const p = data[uid];
                        if (!p || !p.username) return;
                        allPlayers.push({
                            uid,
                            username: p.username,
                            rankPoints: parseInt(p.rankPoints) || 0,
                            spyWins: p.stats?.spyWins || 0,
                            innocentWins: p.stats?.innocentWins || 0,
                            totalGames: p.stats?.totalGames || 0,
                            winRate: calcWinRate(p.stats)
                        });
                    });
                }

                renderAll();
                showContent();
            }, (error) => {
                console.error('[leaderboard] players read failed:', error.code, error.message);
                showError(`${error.code || ''} ${error.message || ''}`.trim());
            });
        }

        function calcWinRate(stats) {
            const total = stats?.totalGames || 0;
            if (!total) return 0;
            const wins = (stats.spyWins || 0) + (stats.innocentWins || 0);
            return ((wins / total) * 100).toFixed(1);
        }

        document.getElementById('refreshBtn').addEventListener('click', () => {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            startListening();
            setTimeout(() => icon.classList.remove('fa-spin'), 700);
        });

        // ═══════════════════════════════════════════════════════
        // RENDER — stat overview + all four tabs
        // ═══════════════════════════════════════════════════════
        function renderAll() {
            document.getElementById('totalPlayers').textContent = allPlayers.length;
            document.getElementById('totalGames').textContent =
                allPlayers.reduce((sum, p) => sum + p.totalGames, 0);
            const topSpy = [...allPlayers].sort((a, b) => b.spyWins - a.spyWins)[0];
            document.getElementById('bestSpy').textContent = topSpy && topSpy.spyWins > 0 ? topSpy.username : '—';

            renderStatPanel('panel-spy', 'spyWins', 'spy',
                { label: 'انتصارات كجاسوس', icon: 'fa-user-secret', color: 'red' });
            renderStatPanel('panel-innocent', 'innocentWins', 'innocent',
                { label: 'انتصارات كبريء', icon: 'fa-shield-halved', color: 'green' });
            renderStatPanel('panel-total', 'totalGames', 'total',
                { label: 'إجمالي المباريات', icon: 'fa-dice', color: 'purple' });

            renderRankPanel();
        }

        function emptyState(msg) {
            return `<div class="glass rounded-2xl p-10 text-center">
                <i class="fas fa-inbox text-4xl text-gray-700 mb-3 block"></i>
                <p class="text-gray-400 font-bold">${msg}</p>
            </div>`;
        }

        function initials(name) {
            return (name || '؟').trim().charAt(0).toUpperCase();
        }

        // ── Generic stat-based leaderboard (spy wins / innocent wins / total games)
        function renderStatPanel(panelId, statKey, colorKeyword, meta) {
            const panel = document.getElementById(panelId);
            const ranked = [...allPlayers].sort((a, b) => b[statKey] - a[statKey]).slice(0, 50);

            if (ranked.length === 0) {
                panel.innerHTML = emptyState('لا توجد بيانات بعد — العب أول مباراة لتظهر هنا!');
                return;
            }

            const top3 = ranked.slice(0, 3);
            const rest = ranked.slice(3);

            const colorMap = {
                red:    { text: 'text-red-400',    ring: 'border-red-400/60' },
                green:  { text: 'text-green-400',  ring: 'border-green-400/60' },
                purple: { text: 'text-purple-400', ring: 'border-purple-400/60' }
            };
            const c = colorMap[meta.color];

            const podiumOrder = [top3[1], top3[0], top3[2]]; // 2nd, 1st, 3rd visual order
            const medalColors = ['#c0c0c0', '#ffd700', '#cd7f32'];

            const podiumHtml = `
                <div class="podium-wrap mb-4">
                    ${podiumOrder.map((p, i) => {
                        if (!p) return '<div></div>';
                        const place = i === 1 ? 1 : (i === 0 ? 2 : 3);
                        const isFirst = place === 1;
                        return `
                        <div class="${isFirst ? 'podium-first-wrap' : ''}">
                            <div class="podium-avatar ${isFirst ? 'first' : ''}"
                                 style="border-color:${medalColors[place - 1]}; background: linear-gradient(135deg, ${medalColors[place - 1]}33, transparent);">
                                ${initials(p.username)}
                                <span class="podium-medal">${place === 1 ? '🥇' : place === 2 ? '🥈' : '🥉'}</span>
                            </div>
                            <div class="podium-block glass" style="border-bottom:3px solid ${medalColors[place - 1]}; height:${isFirst ? '84px' : '66px'};">
                                <p class="text-xs font-black truncate px-1">${p.username}</p>
                                <p class="text-lg font-black ${c.text}" style="font-family:'Orbitron',sans-serif;">${p[statKey]}</p>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;

            const listHtml = rest.map((p, idx) => `
                <div class="lb-row">
                    <span class="lb-pos">${idx + 4}</span>
                    <span class="lb-avatar">${initials(p.username)}</span>
                    <div class="flex-1 min-w-0">
                        <p class="font-black text-sm truncate">${p.username}</p>
                        <p class="text-[10px] text-gray-500">نسبة الفوز ${p.winRate}% · ${p.totalGames} مباراة</p>
                    </div>
                    <div class="text-left flex-shrink-0">
                        <p class="font-black ${c.text}" style="font-family:'Orbitron',sans-serif;">${p[statKey]}</p>
                    </div>
                </div>
            `).join('');

            panel.innerHTML = `
                ${podiumHtml}
                <div class="space-y-2 max-h-[520px] overflow-y-auto custom-scrollbar pr-1">
                    ${listHtml || ''}
                </div>
            `;
        }

        // ── Rank tab — driven entirely by the shared NameThemes rank
        // system (images with automatic emoji fallback, same tier
        // thresholds used by room.html / profile.html / shop.html).
        function renderRankPanel() {
            const listEl = document.getElementById('rankList');
            const tierEl = document.getElementById('tierDistribution');

            const now = new Date();
            document.getElementById('seasonName').textContent =
                'موسم ' + now.toLocaleDateString('ar-SA', { month: 'long', year: 'numeric' });
            document.getElementById('seasonDates').textContent =
                'ينتهي في ' + new Date(now.getFullYear(), now.getMonth() + 1, 0).toLocaleDateString('ar-SA');

            if (!window.NameThemes) {
                listEl.innerHTML = emptyState('نظام الرتب غير متاح حالياً');
                return;
            }

            const ranks = window.NameThemes.ranks;
            const order = window.NameThemes.rankOrder;

            // Rank points are the single source of truth for tier — derive
            // it fresh rather than trusting a possibly-stale stored string.
            const withRank = allPlayers.map(p => ({ ...p, tier: window.NameThemes.getRank(p.rankPoints) }));

            const counts = {};
            order.forEach(k => counts[k] = 0);
            withRank.forEach(p => { counts[p.tier.key] = (counts[p.tier.key] || 0) + 1; });

            tierEl.innerHTML = order.map(key => {
                const r = ranks[key];
                return `
                    <div class="tier-chip" style="background:${r.color}18; border-color:${r.color}55;">
                        <div class="w-7 h-7 mx-auto mb-1 rank-icon-sm" id="tierIcon-${key}"></div>
                        <p class="text-[9px] font-black" style="color:${r.color};">${r.nameAr}</p>
                        <p class="text-sm font-black" style="color:${r.color};">${counts[key] || 0}</p>
                    </div>`;
            }).join('');
            order.forEach(key => {
                const holder = document.getElementById(`tierIcon-${key}`);
                if (holder) holder.appendChild(window.NameThemes.createRankIcon(ranks[key].min, 28));
            });

            if (withRank.length === 0) {
                listEl.innerHTML = emptyState('لا يوجد لاعبون مرتبون بعد');
                return;
            }

            const sorted = withRank.sort((a, b) => b.rankPoints - a.rankPoints).slice(0, 50);

            listEl.innerHTML = sorted.map((p, i) => {
                const progress = window.NameThemes.getProgress(p.rankPoints);
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
                return `
                    <div class="lb-row" style="border-right-color:${p.tier.color}66;">
                        <span class="lb-pos">${medal}</span>
                        <div class="w-9 h-9 flex-shrink-0" id="rankRowIcon-${i}"></div>
                        <div class="flex-1 min-w-0">
                            <p class="font-black text-sm truncate">${p.username}</p>
                            <div class="h-1.5 rounded-full mt-1 overflow-hidden" style="background:rgba(255,255,255,.08);">
                                <div class="h-full rounded-full" style="width:${progress.progressPercent}%; background:${p.tier.color};"></div>
                            </div>
                        </div>
                        <div class="text-left flex-shrink-0">
                            <p class="font-black text-xs" style="color:${p.tier.color};">${p.tier.nameAr}</p>
                            <p class="text-[10px] text-gray-500">${p.rankPoints} نقطة</p>
                        </div>
                    </div>`;
            }).join('');

            sorted.forEach((p, i) => {
                const holder = document.getElementById(`rankRowIcon-${i}`);
                if (holder) holder.appendChild(window.NameThemes.createRankIcon(p.rankPoints, 34));
            });
        }
    </script>
    <script>
        window.alert   = (msg)             => UIAlert ? UIAlert(msg) : alert(msg);
        window.confirm = (msg)             => UIConfirm ? UIConfirm(msg) : confirm(msg);
        window.prompt  = (msg, defaultVal) => UIPrompt ? UIPrompt(msg, { defaultValue: defaultVal }) : prompt(msg, defaultVal);
    </script>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
</body>
</html>
